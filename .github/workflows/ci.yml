name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Actions are pinned to commit hashes (a tag or branch can be moved to other
# code); Dependabot (.github/dependabot.yml) proposes updates to the pins.
# build/ci_test.go fails on an unpinned one. Tools are installed at fixed
# versions, so a run means the same thing as `task check` here.

env:
  GO_VERSION: '1.27.3'
  TASK_VERSION: 'v3.53.1'
  GOLANGCI_LINT_VERSION: 'v2.14.0'
  GOVULNCHECK_VERSION: 'v1.8.0'

jobs:
  go:
    name: Go (fmt, vet, lint, test)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Set up Task
        run: go install github.com/go-task/task/v3/cmd/task@${{ env.TASK_VERSION }}

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l build cmd internal main.go)
          if [ -n "$unformatted" ]; then
            echo "Files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Check go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Verify dependencies
        run: go mod verify

      - name: Vet
        run: task vet

      - name: Lint
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@${{ env.GOLANGCI_LINT_VERSION }}
          task lint

      - name: Test
        run: go test ./... -count=1

      - name: Check for known vulnerabilities
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@${{ env.GOVULNCHECK_VERSION }}
          govulncheck ./...

  race:
    name: Go (race detector)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Test with race detector
        run: go test ./... -count=1 -race -timeout 30m

  # The release builds every platform; catch a build that breaks on one
  # before a tag, not after it. One job per target, in parallel. linux/amd64
  # is the tests' own platform.
  cross:
    name: Go (cross-compile ${{ matrix.target }})
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        target: [darwin/amd64, darwin/arm64, windows/amd64, windows/arm64, linux/arm64]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Cross-compile
        env:
          TARGET: ${{ matrix.target }}
        run: CGO_ENABLED=0 GOOS=${TARGET%/*} GOARCH=${TARGET#*/} go build -o /dev/null .

  docker:
    name: Docker image and deployment files
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build image
        run: docker build --build-arg VERSION=ci --build-arg COMMIT=${{ github.sha }} -t exemplar:ci .

      - name: Check the image runs
        run: docker run --rm exemplar:ci --version

      - name: Check docker-compose.yml
        run: docker compose config -q
