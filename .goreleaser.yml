version: 2

# Releases: binaries for every platform, checksums, SBOMs, keyless
# signatures, a multi-arch image on ghcr.io and a Homebrew cask. Run by
# .github/workflows/release.yml when `task release -- vX.Y.Z` pushes a tag.
# See docs/development.md.

builds:
  - id: exemplar
    main: .
    binary: exemplar
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/martinsuchenak/exemplar/build.Version={{.Version}}
      - -X github.com/martinsuchenak/exemplar/build.Commit={{.ShortCommit}}
      - -X github.com/martinsuchenak/exemplar/build.Date={{.Date}}

# Sign the macOS binaries with the Developer ID certificate and notarize them
# with Apple, on the Linux runner (GoReleaser's cross-platform signer, quill),
# before they are archived. Skipped unless the MACOS_* secrets are set, so a
# fork or a local snapshot builds without them. Setup: docs/development.md,
# "macOS signing and notarization".
notarize:
  macos:
    - enabled: '{{ isEnvSet "MACOS_SIGN_P12" }}'
      ids: [exemplar]
      sign:
        certificate: "{{ .Env.MACOS_SIGN_P12 }}"
        password: "{{ .Env.MACOS_SIGN_PASSWORD }}"
      notarize:
        issuer_id: "{{ .Env.MACOS_NOTARY_ISSUER_ID }}"
        key_id: "{{ .Env.MACOS_NOTARY_KEY_ID }}"
        key: "{{ .Env.MACOS_NOTARY_KEY }}"
        wait: true
        timeout: 20m

archives:
  - id: default
    formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats:
          - zip
    # The licence and notes, the default configuration (`exemplar serve`
    # reads it from the working directory), and the skill agents install to
    # anonymise files.
    files:
      - LICENSE
      - NOTICE
      - THIRD_PARTY_NOTICES.md
      - README.md
      - CHANGELOG.md
      - exemplar-config.toml
      - skills/**/*

checksum:
  name_template: "checksums.txt"

# SPDX JSON software bill of materials for each archive, generated by syft.
sboms:
  - artifacts: archive

# Keyless cosign signatures (GitHub OIDC). The checksum file covers every archive;
# SBOMs are signed separately. Verify with `cosign verify-blob --bundle`.
# The release workflow fetches Sigstore's trust root and signing config once
# and passes them in SIGSTORE_TRUSTED_ROOT and SIGSTORE_SIGNING_CONFIG, so
# the signings GoReleaser runs at once never write cosign's TUF cache
# together.
signs:
  - id: checksum
    cmd: cosign
    artifacts: checksum
    signature: "${artifact}.sigstore.json"
    args:
      - sign-blob
      - "--bundle=${signature}"
      - "--signing-config={{ .Env.SIGSTORE_SIGNING_CONFIG }}"
      - "--trusted-root={{ .Env.SIGSTORE_TRUSTED_ROOT }}"
      - "${artifact}"
      - "--yes"
  - id: sbom
    cmd: cosign
    artifacts: sbom
    signature: "${artifact}.sigstore.json"
    args:
      - sign-blob
      - "--bundle=${signature}"
      - "--signing-config={{ .Env.SIGSTORE_SIGNING_CONFIG }}"
      - "--trusted-root={{ .Env.SIGSTORE_TRUSTED_ROOT }}"
      - "${artifact}"
      - "--yes"

# Multi-arch image on GitHub's container registry, from the release binaries.
dockers_v2:
  - id: exemplar
    ids: [exemplar]
    dockerfile: Dockerfile.release
    extra_files:
      - exemplar-config.toml
      - LICENSE
      - NOTICE
      - THIRD_PARTY_NOTICES.md
    images:
      - ghcr.io/martinsuchenak/exemplar
    tags:
      - "{{ .Version }}"
      - "{{ if not .Prerelease }}{{ .Major }}.{{ .Minor }}{{ end }}"
      - "{{ if not .Prerelease }}latest{{ end }}"
    platforms:
      - linux/amd64
      - linux/arm64
    labels:
      org.opencontainers.image.title: exemplar
      org.opencontainers.image.description: "Test fixtures and anonymised real data, served over REST, MCP and a CLI"
      org.opencontainers.image.source: "https://github.com/martinsuchenak/exemplar"
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.revision: "{{ .FullCommit }}"
      org.opencontainers.image.created: "{{ .Date }}"
      org.opencontainers.image.licenses: Apache-2.0

# Keyless cosign signatures for the images, like the archives. Verify with
# `cosign verify ghcr.io/martinsuchenak/exemplar:<version>
#  --certificate-identity-regexp 'https://github.com/martinsuchenak/exemplar/'
#  --certificate-oidc-issuer https://token.actions.githubusercontent.com`.
docker_signs:
  - cmd: cosign
    args:
      - sign
      - "--signing-config={{ .Env.SIGSTORE_SIGNING_CONFIG }}"
      - "--trusted-root={{ .Env.SIGSTORE_TRUSTED_ROOT }}"
      - "${artifact}@${digest}"
      - "--yes"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"

homebrew_casks:
  - name: exemplar
    repository:
      owner: martinsuchenak
      name: homebrew-tap
      token: "{{ .Env.TAP_GITHUB_TOKEN }}"
    directory: Casks
    homepage: "https://github.com/martinsuchenak/exemplar"
    description: "Test fixtures and anonymised real data, served over REST, MCP and a CLI"
    binaries:
      - exemplar
    # The binary is not notarised, so macOS would quarantine it; this lifts
    # the quarantine for the installed binary only. Homebrew's declarative
    # install steps (GoReleaser 2.19+).
    hooks:
      post:
        install_steps: |
          on_macos do
            run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{ .StagedPath }}/exemplar"]
          end
