openapi: "3.1.0"
info:
  title: exemplar
  version: "1.0.0"
  description: |
    Test fixture library. Every /api/v1 route needs an API key in X-API-Key.
    Errors are {"error": "<message>"}; see docs/api.md for status codes.
servers:
  - url: http://localhost:8080
    description: Local development
security:
  - apiKey: []
paths:
  /health:
    get:
      summary: Health check
      operationId: healthCheck
      security: []
      responses:
        "200":
          description: Service is healthy
  /metrics:
    get:
      summary: Application metrics (admin key)
      operationId: getMetrics
      responses:
        "200":
          description: Current metrics
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /api/v1/me:
    get:
      summary: The calling account and key
      operationId: getMe
      responses:
        "200":
          description: Account and principal
          content:
            application/json:
              schema:
                type: object
                properties:
                  account: { $ref: "#/components/schemas/Account" }
                  principal: { $ref: "#/components/schemas/Principal" }
        "401": { $ref: "#/components/responses/Error" }
  /api/v1/accounts:
    get:
      summary: List accounts (all for admins, own otherwise)
      operationId: listAccounts
      responses:
        "200":
          description: Accounts
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Account" } }
    post:
      summary: Create an account (admin)
      operationId: createAccount
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, kind]
              properties:
                name: { type: string }
                kind: { type: string, enum: [developer, team, app] }
                role: { type: string, enum: [member, admin], default: member }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Account" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/v1/accounts/{id}:
    parameters: [{ $ref: "#/components/parameters/ID" }]
    get:
      summary: Get an account (self or admin)
      operationId: getAccount
      responses:
        "200":
          description: Account
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Account" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/accounts/{id}/disable:
    parameters: [{ $ref: "#/components/parameters/ID" }]
    post:
      summary: Disable an account and revoke its keys (admin)
      operationId: disableAccount
      responses:
        "204": { description: Disabled }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/v1/keys:
    get:
      summary: List keys
      operationId: listKeys
      parameters:
        - { name: account_id, in: query, schema: { type: string }, description: "Another account's keys (admin)" }
      responses:
        "200":
          description: Keys
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/APIKey" } }
    post:
      summary: Create a key; the secret is returned once
      operationId: createKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                account_id: { type: string }
                name: { type: string }
                scopes: { type: array, items: { type: string, enum: [read, write, admin] } }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  key: { $ref: "#/components/schemas/APIKey" }
                  secret: { type: string }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /api/v1/keys/{id}:
    parameters: [{ $ref: "#/components/parameters/ID" }]
    delete:
      summary: Revoke a key
      operationId: revokeKey
      responses:
        "204": { description: Revoked }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/datasets:
    get:
      summary: List datasets the key can read
      operationId: listDatasets
      parameters:
        - { name: scope, in: query, schema: { type: string, enum: [global, workspace, quarantine] } }
        - { name: name, in: query, schema: { type: string } }
      responses:
        "200":
          description: Datasets
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Dataset" } }
    post:
      summary: Create a dataset
      operationId: createDataset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
                description: { type: string }
                scope: { type: string, enum: [global, workspace, quarantine], default: workspace }
                tags: { type: array, items: { type: string } }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Dataset" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/v1/datasets/{id}:
    parameters: [{ $ref: "#/components/parameters/ID" }]
    get:
      summary: Get a dataset
      operationId: getDataset
      responses:
        "200":
          description: Dataset
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Dataset" }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      summary: Delete a dataset and its fixtures
      operationId: deleteDataset
      responses:
        "204": { description: Deleted }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/datasets/{id}/freeze:
    parameters: [{ $ref: "#/components/parameters/ID" }]
    post:
      summary: Make a dataset's contents read-only
      operationId: freezeDataset
      responses:
        "200":
          description: Frozen dataset
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Dataset" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/datasets/{id}/fork:
    parameters: [{ $ref: "#/components/parameters/ID" }]
    post:
      summary: Copy a dataset into a new workspace of the caller's
      operationId: forkDataset
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                description: { type: string }
      responses:
        "201": { $ref: "#/components/responses/CopyResult" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/v1/datasets/{id}/promote:
    parameters: [{ $ref: "#/components/parameters/ID" }]
    post:
      summary: Copy a dataset into the global library as a frozen version (admin)
      operationId: promoteDataset
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
      responses:
        "201": { $ref: "#/components/responses/CopyResult" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/datasets/{id}/fixtures:
    parameters: [{ $ref: "#/components/parameters/ID" }]
    get:
      summary: List a dataset's fixtures
      operationId: listFixtures
      parameters:
        - { name: kind, in: query, schema: { type: string, enum: [email, file, record] } }
        - { name: format, in: query, schema: { type: string } }
        - { name: scenario, in: query, schema: { type: string } }
        - { name: tag, in: query, schema: { type: string } }
        - { name: review_state, in: query, schema: { type: string, enum: [not-required, unreviewed, approved, rejected] } }
        - { name: record_schema, in: query, schema: { type: string } }
        - { name: person_id, in: query, schema: { type: string }, description: Fixtures that mention this person }
        - { name: limit, in: query, schema: { type: integer, default: 100, maximum: 1000 } }
        - { name: offset, in: query, schema: { type: integer, default: 0 } }
      responses:
        "200":
          description: Fixtures by name
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Fixture" } }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    post:
      summary: Upload a fixture (raw content body)
      operationId: uploadFixture
      parameters:
        - { name: name, in: query, required: true, schema: { type: string } }
        - { name: kind, in: query, schema: { type: string, enum: [email, file, record] } }
        - { name: format, in: query, schema: { type: string } }
        - { name: mime_type, in: query, schema: { type: string } }
        - { name: scenario, in: query, schema: { type: string } }
        - { name: tags, in: query, schema: { type: string }, description: Comma-separated or repeated }
        - { name: source, in: query, schema: { type: string, enum: [uploaded, synthetic, public-corpus, anonymised], default: uploaded } }
        - { name: generator, in: query, schema: { type: string } }
        - { name: record_schema, in: query, schema: { type: string }, description: Makes the upload a record }
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Fixture" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }
  /api/v1/fixtures/{id}:
    parameters: [{ $ref: "#/components/parameters/ID" }]
    get:
      summary: Get a fixture's metadata
      operationId: getFixture
      responses:
        "200":
          description: Fixture
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Fixture" }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      summary: Delete a fixture
      operationId: deleteFixture
      responses:
        "204": { description: Deleted }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/v1/fixtures/{id}/content:
    parameters: [{ $ref: "#/components/parameters/ID" }]
    get:
      summary: Download a fixture's content
      operationId: downloadFixture
      responses:
        "200":
          description: Content, as an attachment named after the fixture
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/fixtures/{id}/review:
    parameters: [{ $ref: "#/components/parameters/ID" }]
    post:
      summary: Approve or reject a real-derived fixture (admin)
      operationId: reviewFixture
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [approve]
              properties:
                approve: { type: boolean }
      responses:
        "200":
          description: Reviewed fixture
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Fixture" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/v1/purge:
    post:
      summary: Delete every fixture from an ingest batch (admin)
      operationId: purgeBatch
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ingest_batch]
              properties:
                ingest_batch: { type: string }
      responses:
        "200":
          description: Purged
          content:
            application/json:
              schema:
                type: object
                properties:
                  ingest_batch: { type: string }
                  deleted: { type: integer }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /api/v1/datasets/{id}/generate:
    parameters: [{ $ref: "#/components/parameters/ID" }]
    post:
      summary: Fill a dataset with synthetic files, emails or records
      operationId: generateFixtures
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind, count]
              properties:
                kind: { type: string, enum: [files, emails, records] }
                count: { type: integer, minimum: 1, maximum: 500 }
                formats: { type: array, items: { type: string, enum: [csv, docx, gif, html, jpg, pdf, png, rtf, txt, xlsx] } }
                shapes:
                  type: array
                  items: { type: string, enum: [plain, html, reply, forward, forward-attached, attachment, inline-image, calendar, auto-reply, bounce, newsletter, thread] }
                from:
                  type: array
                  maxItems: 50
                  items: { type: string }
                  description: Emails only, instead of shapes. Template email fixture IDs to render with registry people swapped in; real-derived ones must be approved. Generated emails keep the template's ingest_batch.
                schemas: { type: array, items: { type: string, enum: [contact, company, project, opportunity, address] } }
                profile: { type: string, enum: [insurance, manufacturing], default: insurance }
                people: { type: integer, minimum: 1, maximum: 200, description: With from, at least the largest template's people }
                seed: { type: integer, description: 0 or absent picks a random seed }
                scenario: { type: string }
                tags: { type: array, items: { type: string } }
      responses:
        "201":
          description: Generated
          content:
            application/json:
              schema:
                type: object
                properties:
                  seed: { type: integer }
                  fixtures: { type: array, items: { $ref: "#/components/schemas/Fixture" } }
                  person_ids: { type: array, items: { type: string } }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/v1/datasets/{id}/ingest:
    parameters: [{ $ref: "#/components/parameters/ID" }]
    post:
      summary: Anonymise real emails and documents into a quarantine dataset (admin key)
      description: >
        Each part's file name picks its format: .eml, .txt, .log, .md, .csv,
        .tsv, .json, .jsonl, .html, .twig, .j2, .docx or .rtf (see docs/anonymisation.md).
        Parts are read into memory, never written to disk; only anonymised
        output is stored, as unreviewed fixtures named <batch>-NNN plus the
        file's extension (<batch>-001.eml, <batch>-002.csv). A dry
        run stores nothing and reports each replacement with its original
        value, so responses are never cached. Answers 400 when the server has
        no anonymiser configured.
      operationId: ingestEmails
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: array, maxItems: 1000, items: { type: string, format: binary }, description: One part per file }
                profile: { type: string, default: default }
                batch: { type: string, pattern: "^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$", description: Absent makes up a batch name }
                dry_run: { type: boolean, default: false }
      responses:
        "200":
          description: Dry run
          headers: { Cache-Control: { schema: { type: string, enum: [no-store] } } }
          content: { application/json: { schema: { $ref: "#/components/schemas/IngestResult" } } }
        "201":
          description: Ingested; files that failed carry an error
          headers: { Cache-Control: { schema: { type: string, enum: [no-store] } } }
          content: { application/json: { schema: { $ref: "#/components/schemas/IngestResult" } } }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }
  /api/v1/anonymise:
    post:
      summary: Anonymise files and return them, storing nothing (any key that can read)
      description: >
        The anonymise tool. Send one file as the raw body, named by ?name=
        (or typed by ?format=), and get the anonymised file back in the same
        format, with its fake name in Content-Disposition. Or send
        multipart/form-data with several file parts, anonymised as one batch
        sharing fakes, and get a zip of the files under their fake names plus
        manifest.json. Fakes come from a key made for the request alone, so
        they match nothing in the library; link_registry (admin key) uses the
        server's key and registry instead, as ingest does. The response never
        holds original data. One run at a time per key (429 otherwise).
        Answers 400 when the server has no Presidio configured.
      operationId: anonymiseFiles
      parameters:
        - { name: name, in: query, schema: { type: string }, description: "The file's name, whose extension picks the format (raw body only)" }
        - { name: format, in: query, schema: { type: string, enum: [eml, txt, md, csv, tsv, json, jsonl, html, twig, jinja, docx, rtf] }, description: Format, when there is no name (raw body only) }
        - { name: profile, in: query, schema: { type: string, default: default } }
        - { name: link_registry, in: query, schema: { type: boolean, default: false }, description: "Linked fakes, as ingest makes (admin key)" }
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: array, maxItems: 1000, items: { type: string, format: binary }, description: One part per file }
                profile: { type: string, default: default }
                link_registry: { type: boolean, default: false }
      responses:
        "200":
          description: >
            The anonymised file (raw request), or a zip of the files plus
            manifest.json, an AnonymiseResult (multipart request).
          headers:
            Cache-Control: { schema: { type: string, enum: [no-store] } }
            X-Exemplar-Unreviewed: { schema: { type: string, enum: ["true"] } }
            X-Exemplar-Format: { schema: { type: string }, description: Raw request only }
            X-Exemplar-Replacements: { schema: { type: integer }, description: Raw request only }
            X-Exemplar-Attachments: { schema: { type: integer }, description: Raw request only }
            X-Exemplar-Dropped-Headers: { schema: { type: integer }, description: Raw request only }
            X-Exemplar-Dropped-Parts: { schema: { type: string }, description: "Raw request only: a document's dropped parts, comma-separated; absent when none" }
          content:
            "*/*": { schema: { type: string, format: binary } }
            application/zip: { schema: { type: string, format: binary } }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /api/v1/export:
    post:
      summary: Export datasets to an archive another instance can import
      description: >
        Up to 50 datasets the key can read, with their fixtures, linked
        people and contents. Real-derived fixtures go only if approved; the
        rest are counted in X-Exemplar-Skipped. Everything is decided before
        streaming; a failure while streaming aborts the connection, so the
        client sees an error rather than a short archive.
      operationId: exportDatasets
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [dataset_ids]
              properties:
                dataset_ids: { type: array, minItems: 1, maxItems: 50, items: { type: string } }
      responses:
        "200":
          description: The archive (tar.gz)
          headers:
            X-Exemplar-Datasets: { schema: { type: integer } }
            X-Exemplar-Fixtures: { schema: { type: integer } }
            X-Exemplar-Persons: { schema: { type: integer } }
            X-Exemplar-Blobs: { schema: { type: integer } }
            X-Exemplar-Skipped: { schema: { type: integer } }
          content:
            application/gzip: { schema: { type: string, format: binary } }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/import:
    post:
      summary: Import an export archive
      description: >
        Keeps IDs, so importing twice adds nothing the second time. Global
        and quarantine datasets and real-derived fixtures need an admin key;
        with a member key real-derived fixtures are skipped and listed.
        Real-derived fixtures arrive approved, with imported_reviewer set.
      operationId: importDatasets
      requestBody:
        required: true
        content:
          application/gzip: { schema: { type: string, format: binary } }
      responses:
        "201":
          description: Imported
          content:
            application/json:
              schema:
                type: object
                properties:
                  datasets:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        name: { type: string }
                        scope: { type: string, enum: [global, workspace, quarantine] }
                        version: { type: integer }
                        created: { type: boolean, description: false when the dataset was already here }
                        added: { type: integer }
                        existing: { type: integer }
                  people_added: { type: integer }
                  people_merged: { type: integer, description: People matched to people already here by email }
                  skipped:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        name: { type: string }
                        dataset_id: { type: string }
                        reason: { type: string }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }
  /api/v1/persons:
    get:
      summary: List people in the registry
      operationId: listPersons
      parameters:
        - { name: company, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, default: 100, maximum: 1000 } }
        - { name: offset, in: query, schema: { type: integer, default: 0 } }
      responses:
        "200":
          description: People by last name
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Person" } }
    post:
      summary: Add new people to the registry
      operationId: generatePersons
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [count]
              properties:
                count: { type: integer, minimum: 1, maximum: 1000 }
                seed: { type: integer }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  seed: { type: integer }
                  people: { type: array, items: { $ref: "#/components/schemas/Person" } }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /api/v1/persons/{id}:
    parameters: [{ $ref: "#/components/parameters/ID" }]
    get:
      summary: Get a person
      operationId: getPerson
      responses:
        "200":
          description: Person
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Person" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/audit:
    get:
      summary: List audit events (admin)
      operationId: listAudit
      parameters:
        - { name: account_id, in: query, schema: { type: string } }
        - { name: action, in: query, schema: { type: string } }
        - { name: target_type, in: query, schema: { type: string } }
        - { name: target_id, in: query, schema: { type: string } }
        - { name: after_seq, in: query, schema: { type: integer }, description: Paging cursor }
        - { name: limit, in: query, schema: { type: integer, maximum: 1000 } }
      responses:
        "200":
          description: Events in order
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/AuditEvent" } }
        "403": { $ref: "#/components/responses/Error" }
components:
  securitySchemes:
    apiKey:
      type: apiKey
      in: header
      name: X-API-Key
  parameters:
    ID:
      name: id
      in: path
      required: true
      schema: { type: string }
  responses:
    Error:
      description: Error
      content:
        application/json:
          schema:
            type: object
            properties:
              error: { type: string }
    CopyResult:
      description: The dataset created and what was copied into it
      content:
        application/json:
          schema:
            type: object
            properties:
              dataset: { $ref: "#/components/schemas/Dataset" }
              copied: { type: integer }
              skipped: { type: integer, description: Real-derived fixtures not approved }
  schemas:
    Account:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        kind: { type: string, enum: [developer, team, app] }
        role: { type: string, enum: [member, admin] }
        created_at: { type: string, format: date-time }
        disabled_at: { type: string, format: date-time }
    Principal:
      type: object
      properties:
        account_id: { type: string }
        account_name: { type: string }
        role: { type: string }
        key_id: { type: string }
        scopes: { type: array, items: { type: string } }
    APIKey:
      type: object
      properties:
        id: { type: string }
        account_id: { type: string }
        name: { type: string }
        prefix: { type: string }
        scopes: { type: array, items: { type: string } }
        created_at: { type: string, format: date-time }
        last_used_at: { type: string, format: date-time }
        revoked_at: { type: string, format: date-time }
    Dataset:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string }
        scope: { type: string, enum: [global, workspace, quarantine] }
        owner_account_id: { type: string }
        parent_id: { type: string }
        version: { type: integer }
        tags: { type: array, items: { type: string } }
        frozen_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    Fixture:
      type: object
      properties:
        id: { type: string }
        dataset_id: { type: string }
        name: { type: string }
        kind: { type: string, enum: [email, file, record] }
        format: { type: string }
        mime_type: { type: string }
        blob_hash: { type: string }
        size: { type: integer }
        scenario: { type: string }
        tags: { type: array, items: { type: string } }
        source: { type: string, enum: [synthetic, uploaded, public-corpus, anonymised] }
        generator: { type: string }
        anon_profile: { type: string }
        anon_key_id: { type: string }
        ingest_batch: { type: string }
        review_state: { type: string, enum: [not-required, unreviewed, approved, rejected] }
        reviewed_by: { type: string }
        reviewed_at: { type: string, format: date-time }
        imported_reviewer: { type: string, description: Source instance's reviewer account ID for a fixture imported already approved; reviewed_by is then empty }
        created_by: { type: string }
        created_at: { type: string, format: date-time }
        record_schema: { type: string }
        people:
          type: array
          items:
            type: object
            properties:
              person_id: { type: string }
              role: { type: string }
    Person:
      type: object
      properties:
        id: { type: string }
        first_name: { type: string }
        last_name: { type: string }
        email: { type: string }
        phone: { type: string }
        job_title: { type: string }
        company: { type: string }
        address:
          type: object
          properties:
            street: { type: string }
            suburb: { type: string }
            state: { type: string }
            postcode: { type: string }
            country: { type: string }
        created_by: { type: string }
        created_at: { type: string, format: date-time }
    IngestResult:
      type: object
      properties:
        batch: { type: string }
        profile: { type: string }
        key_id: { type: string, description: Id of the anonymisation key, k- plus 12 hex characters }
        dry_run: { type: boolean }
        files:
          type: array
          items:
            type: object
            properties:
              name: { type: string }
              fixture_id: { type: string }
              fixture_name: { type: string }
              replacements: { type: integer }
              attachments: { type: integer }
              dropped_headers: { type: integer }
              dropped_parts: { type: integer, description: "A document's parts removed rather than rewritten (a DOCX's macros, an RTF's embedded object data)" }
              error: { type: string, description: Set when this file failed; the others went ahead }
              report:
                type: array
                description: Dry run only. Holds ORIGINAL personal data.
                items:
                  type: object
                  properties:
                    entity: { type: string }
                    original: { type: string }
                    fake: { type: string }
    AnonymiseResult:
      type: object
      description: manifest.json in a multi-file anonymise zip. It holds no original names or values.
      properties:
        profile: { type: string }
        linked: { type: boolean }
        files:
          type: array
          items:
            type: object
            properties:
              name: { type: string, description: "Fake name, as in the zip; absent for a failed file" }
              format: { type: string }
              replacements: { type: integer }
              attachments: { type: integer }
              dropped_headers: { type: integer }
              dropped_parts: { type: array, items: { type: string }, description: "A document's parts removed rather than rewritten" }
              error: { type: string }
    AuditEvent:
      type: object
      properties:
        seq: { type: integer }
        id: { type: string }
        at: { type: string, format: date-time }
        account_id: { type: string }
        action: { type: string }
        target_type: { type: string }
        target_id: { type: string }
        details: { type: object }
