openapi: "3.1.0"
info:
  title: exemplar
  version: "1.0.0"
  description: API for exemplar service
servers:
  - url: http://localhost:8080
    description: Local development
paths:
  /health:
    get:
      summary: Health check
      operationId: healthCheck
      responses:
        "200":
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
  /metrics:
    get:
      summary: Application metrics
      operationId: getMetrics
      responses:
        "200":
          description: Current metrics
  /api/v1/me:
    get:
      summary: The calling account and key
      operationId: getMe
      security:
        - apiKey: []
      responses:
        "200":
          description: The account and the principal the key acts as
        "401":
          description: Missing, unknown or revoked key
components:
  securitySchemes:
    apiKey:
      type: apiKey
      in: header
      name: X-API-Key
