name = "product"
description = "A product or service from the catalogue: SKU, name, category, unit and price"
step = "catalogue"
title = "{name}"

# Catalogue entries depend only on this file, the business profile and the
# entry number, never on a request's seed: product 7 is the same in every
# dataset, and every quote's lines are products from here.
[catalogue]
size = 24

[[catalogue.fields]]
name = "sku"
ref = "PRD"

[[catalogue.fields]]
name = "name"
nth = "@product"

# category and unit are lists in step with product: entry n takes item n of
# each, so a product's category and unit always fit it.
[[catalogue.fields]]
name = "category"
nth = "@category"

[[catalogue.fields]]
name = "unit"
nth = "@unit"

[[catalogue.fields]]
name = "unit_price"
money = [25, 4500]
format = "number"

[[catalogue.fields]]
name = "description"
text = "sentence"

